! ==============================================================================
! Template: templates/asa/asa-base.cfg
! Purpose: Hardened Baseline Configuration Template for Cisco ASA Firewalls
! Standard: RFC 5737 (Documentation IP Blocks) & Cisco Security Hardening Guidelines
! Note: Replace bracketed tokens {{ TOKEN }} before lab staging or deployment.
! ==============================================================================

! --- System Identification ---
hostname {{ FIREWALL_HOSTNAME | default("fw-edge-01.corp.example") }}
domain-name {{ DOMAIN_NAME | default("corp.example") }}

! --- Cryptographic Protection for Passwords ---
! Enforce AES encryption for locally stored pre-shared keys and passwords
password encryption aes
key 1 {{ AES_MASTER_KEY_HEX }}
key 2 {{ AES_BACKUP_KEY_HEX }}

! --- Administrative Authentication ---
! Strong salted hash for enable access (Type 8 PBKDF2 or Type 9 Scrypt)
enable secret 8 {{ ENABLE_SECRET_HASH }}

! Default local fallback emergency account (least privilege / emergency access only)
username secadmin privilege 15 secret 8 {{ LOCAL_ADMIN_SECRET_HASH }}

! --- Layer 3 Network Interfaces & Security Zones ---
interface GigabitEthernet0/0
 nameif outside
 security-level 0
 description WAN Primary Uplink to Edge ISP
 ip address {{ WAN_IP | default("203.0.113.2") }} {{ WAN_NETMASK | default("255.255.255.248") }}
 no shutdown
!
interface GigabitEthernet0/1
 nameif inside
 security-level 100
 description Core LAN Distribution Uplink
 ip address {{ INSIDE_IP | default("192.0.2.1") }} {{ INSIDE_NETMASK | default("255.255.255.0") }}
 no shutdown
!
interface GigabitEthernet0/2
 nameif dmz
 security-level 50
 description Public Services & DMZ Segment
 ip address {{ DMZ_IP | default("198.51.100.1") }} {{ DMZ_NETMASK | default("255.255.255.0") }}
 no shutdown
!
interface GigabitEthernet0/3
 nameif management
 security-level 100
 management-only
 description Dedicated Out-Of-Band Management Network (Isolated VLAN)
 ip address {{ MGMT_IP | default("192.0.2.254") }} {{ MGMT_NETMASK | default("255.255.255.0") }}
 no shutdown

! --- Static Default & Internal Routes ---
route outside 0.0.0.0 0.0.0.0 {{ WAN_GATEWAY | default("203.0.113.1") }} 1
route inside 192.0.2.128 255.255.255.128 {{ INSIDE_CORE_SWITCH | default("192.0.2.2") }} 1

! --- Centralized AAA Authentication (Cisco ISE / TACACS+ / RADIUS) ---
aaa-server ISE_SERVERS protocol radius
aaa-server ISE_SERVERS (management) host {{ ISE_PRIMARY_IP | default("192.0.2.60") }}
 key 8 {{ ISE_SHARED_SECRET }}
 authentication-port 1812
 accounting-port 1813
 timeout 5
 retry-interval 3
!
aaa authentication ssh console ISE_SERVERS LOCAL
aaa authentication enable console ISE_SERVERS LOCAL
aaa authorization exec authentication-server

! --- Secure Management Plane (SSH Hardening) ---
ssh version 2
! Restrict SSH strictly to trusted management subnets / bastion hosts
ssh {{ MGMT_BASTION_SUBNET | default("192.0.2.64") }} {{ MGMT_BASTION_MASK | default("255.255.255.224") }} management
ssh timeout 15
ssh key-exchange group dh-group14-sha256
console timeout 15

! Explicitly disable legacy / insecure management services
no telnet 0.0.0.0 0.0.0.0 inside
no telnet 0.0.0.0 0.0.0.0 outside
no http server enable

! --- Comprehensive Audit Logging & SIEM Integration ---
logging enable
logging timestamp
logging buffer-size 131072
logging buffered warnings
logging trap informational
logging host management {{ SYSLOG_SIEM_IP | default("192.0.2.50") }}
logging facility 20
logging device-id hostname

! --- Network Object Definitions (Least Privilege) ---
object network obj-host-siem
 host {{ SYSLOG_SIEM_IP | default("192.0.2.50") }}
 description Central Security SIEM Collector
!
object network obj-host-ise
 host {{ ISE_PRIMARY_IP | default("192.0.2.60") }}
 description Cisco ISE Authentication Node
!
object network obj-srv-web-dmz
 host {{ DMZ_WEB_IP | default("198.51.100.10") }}
 description DMZ Customer Facing HTTPS Web Server

! --- Access Control Lists (Explicit Permits and Logging) ---
access-list OUTSIDE_IN extended permit tcp any object obj-srv-web-dmz eq 443
access-list OUTSIDE_IN extended deny ip any any log interval 300
!
access-list DMZ_IN extended permit tcp object obj-srv-web-dmz host {{ DB_INTERNAL_IP | default("192.0.2.70") }} eq 3306
access-list DMZ_IN extended deny ip any any log interval 300
!
access-group OUTSIDE_IN in interface outside
access-group DMZ_IN in interface dmz

! --- Modular Policy Framework (MPF) Stateful Inspection ---
class-map inspection_default
 match default-inspection-traffic
!
policy-map global_policy
 class inspection_default
  inspect icmp
  inspect icmp error
  inspect ip-options
  inspect tcp
  inspect udp
  inspect dns
!
service-policy global_policy global

! --- Verification & Operational Commands ---
! show version
! show interface ip brief
! show access-list
! show logging
! show aaa-server ISE_SERVERS
! write memory

