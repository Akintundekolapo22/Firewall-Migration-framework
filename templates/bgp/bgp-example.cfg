! ==============================================================================
! Template: templates/bgp/bgp-example.cfg
! Purpose: Hardened BGP Edge Peering Configuration Template
! Standards: RFC 7454 (BGP Operations and Security), RFC 6996 (Private ASNs)
! Note: Replace bracketed tokens {{ TOKEN }} before staging.
! ==============================================================================

! --- IP Prefix-Lists for Ingress and Egress Filtering ---
! Permitted outbound prefixes (Strictly enterprise allocated blocks)
ip prefix-list PL_OUTBOUND_ADVERTISED seq 10 permit 203.0.113.0/24
ip prefix-list PL_OUTBOUND_ADVERTISED seq 20 permit 198.51.100.0/24

! Ingress bogon and martian filter (Block RFC 1918, loopbacks, documentation nets from ISP)
ip prefix-list PL_BOGON_BLOCK seq 10 permit 10.0.0.0/8 le 32
ip prefix-list PL_BOGON_BLOCK seq 20 permit 172.16.0.0/12 le 32
ip prefix-list PL_BOGON_BLOCK seq 30 permit 192.168.0.0/16 le 32
ip prefix-list PL_BOGON_BLOCK seq 40 permit 127.0.0.0/8 le 32
ip prefix-list PL_BOGON_BLOCK seq 50 permit 0.0.0.0/0
ip prefix-list PL_DEFAULT_ROUTE seq 10 permit 0.0.0.0/0

! --- Route-Maps for Ingress Policy and Preference ---
route-map RM_ISP_A_IN deny 10
 match ip address prefix-list PL_BOGON_BLOCK
!
route-map RM_ISP_A_IN permit 20
 description Accept default and specific routes from ISP-A with higher local preference
 match ip address prefix-list PL_DEFAULT_ROUTE
 set local-preference 200
!
route-map RM_ISP_B_IN deny 10
 match ip address prefix-list PL_BOGON_BLOCK
!
route-map RM_ISP_B_IN permit 20
 description Accept backup routes from ISP-B with standard local preference
 match ip address prefix-list PL_DEFAULT_ROUTE
 set local-preference 100

! --- Route-Maps for Egress Policy (Traffic Engineering) ---
route-map RM_ISP_A_OUT permit 10
 description Advertise primary blocks to ISP-A without AS prepending
 match ip address prefix-list PL_OUTBOUND_ADVERTISED
!
route-map RM_ISP_B_OUT permit 10
 description Advertise backup path to ISP-B with 2x AS Path Prepending
 match ip address prefix-list PL_OUTBOUND_ADVERTISED
 set as-path prepend {{ LOCAL_ASN | default("64512") }} {{ LOCAL_ASN | default("64512") }}

! --- BGP Routing Daemon Configuration ---
router bgp {{ LOCAL_ASN | default("64512") }}
 bgp router-id {{ BGP_ROUTER_ID | default("203.0.113.2") }}
 bgp log-neighbor-changes
 bgp graceful-restart
 no bgp default ipv4-unicast

 address-family ipv4 unicast
  ! Network advertisements to external peers
  network 203.0.113.0 mask 255.255.255.0
  network 198.51.100.0 mask 255.255.255.0

  ! --- Neighbor 1: Primary ISP (ISP-A) ---
  neighbor {{ PEER_ISP_A_IP | default("203.0.113.1") }} remote-as {{ PEER_ISP_A_ASN | default("64520") }}
  neighbor {{ PEER_ISP_A_IP | default("203.0.113.1") }} description Primary Edge Transit ISP-A
  neighbor {{ PEER_ISP_A_IP | default("203.0.113.1") }} password {{ BGP_MD5_AUTH_KEY_A }}
  neighbor {{ PEER_ISP_A_IP | default("203.0.113.1") }} activate
  neighbor {{ PEER_ISP_A_IP | default("203.0.113.1") }} route-map RM_ISP_A_IN in
  neighbor {{ PEER_ISP_A_IP | default("203.0.113.1") }} route-map RM_ISP_A_OUT out
  ! Safeguard against route leaks or routing table exhaustion:
  neighbor {{ PEER_ISP_A_IP | default("203.0.113.1") }} maximum-prefix 100 80 warning-only

  ! --- Neighbor 2: Secondary / Backup ISP (ISP-B) ---
  neighbor {{ PEER_ISP_B_IP | default("203.0.113.9") }} remote-as {{ PEER_ISP_B_ASN | default("64530") }}
  neighbor {{ PEER_ISP_B_IP | default("203.0.113.9") }} description Secondary Backup Transit ISP-B
  neighbor {{ PEER_ISP_B_IP | default("203.0.113.9") }} password {{ BGP_MD5_AUTH_KEY_B }}
  neighbor {{ PEER_ISP_B_IP | default("203.0.113.9") }} activate
  neighbor {{ PEER_ISP_B_IP | default("203.0.113.9") }} route-map RM_ISP_B_IN in
  neighbor {{ PEER_ISP_B_IP | default("203.0.113.9") }} route-map RM_ISP_B_OUT out
  neighbor {{ PEER_ISP_B_IP | default("203.0.113.9") }} maximum-prefix 100 80 warning-only
 exit-address-family

! --- Operational and Verification Commands ---
! show bgp summary
! show ip bgp neighbors
! show ip bgp neighbors 203.0.113.1 received-routes
! show ip bgp neighbors 203.0.113.1 advertised-routes
! show ip route bgp

