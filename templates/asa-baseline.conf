! ==============================================================================
! Template: templates/asa-baseline.conf
! Purpose: Enterprise Hardened Cisco ASA Security Baseline Configuration
! Framework Alignment: NIST SP 800-53 Rev. 5, CIS Cisco ASA Benchmark v4.1.0
! Standards Compliance: RFC 5737 (Documentation IPv4), RFC 2606 (.example DNS)
! Note: Replace tokens marked with {{ TOKEN }} prior to staging.
! ==============================================================================

! --- System Hostname and Domain ---
hostname {{ FIREWALL_HOSTNAME | default("fw-edge-01.corp.example") }}
domain-name {{ DOMAIN_NAME | default("corp.example") }}

! --- Master Cryptographic Passphrase Encryption ---
! Protects local pre-shared keys and credentials at rest using master AES keys
password encryption aes
key 1 {{ AES_PRIMARY_KEY_HEX }}
key 2 {{ AES_BACKUP_KEY_HEX }}

! --- Administrative Authentication & Local Fallback ---
! Enforce Type 8 PBKDF2/SHA-256 salted hashes for enable mode
enable secret 8 {{ ENABLE_SECRET_HASH }}

! Local emergency administrative user with restricted privilege
username secadmin privilege 15 secret 8 {{ LOCAL_ADMIN_SECRET_HASH }}

! --- Physical Interfaces and Security Zones ---
interface GigabitEthernet0/0
 nameif outside
 security-level 0
 description WAN Primary Internet Uplink
 ip address {{ WAN_IP | default("203.0.113.2") }} {{ WAN_NETMASK | default("255.255.255.248") }}
 no shutdown
!
interface GigabitEthernet0/1
 nameif inside
 security-level 100
 description Corporate Internal LAN Core Gateway
 ip address {{ INSIDE_IP | default("192.0.2.1") }} {{ INSIDE_NETMASK | default("255.255.255.0") }}
 no shutdown
!
interface GigabitEthernet0/2
 nameif dmz
 security-level 50
 description Demilitarized Segment for Public-Facing Services
 ip address {{ DMZ_IP | default("198.51.100.1") }} {{ DMZ_NETMASK | default("255.255.255.0") }}
 no shutdown
!
interface GigabitEthernet0/3
 nameif management
 security-level 100
 management-only
 description Dedicated Out-Of-Band Management Network (Isolated VLAN)
 ip address {{ MGMT_IP | default("192.0.2.254") }} {{ MGMT_NETMASK | default("255.255.255.0") }}
 no shutdown

! --- Static Routing & Gateway of Last Resort ---
route outside 0.0.0.0 0.0.0.0 {{ WAN_GATEWAY | default("203.0.113.1") }} 1
route inside 192.0.2.128 255.255.255.128 {{ CORE_SWITCH_IP | default("192.0.2.2") }} 1

! --- Centralized Identity & AAA (Cisco ISE Integration) ---
aaa-server ISE_RADIUS protocol radius
aaa-server ISE_RADIUS (management) host {{ ISE_PRIMARY_IP | default("192.0.2.60") }}
 key 8 {{ ISE_SHARED_SECRET }}
 authentication-port 1812
 accounting-port 1813
 timeout 5
 retry-interval 3
!
aaa authentication ssh console ISE_RADIUS LOCAL
aaa authentication enable console ISE_RADIUS LOCAL
aaa authorization exec authentication-server

! --- Secure Administrative Access (SSH Hardening) ---
ssh version 2
ssh {{ MGMT_BASTION_SUBNET | default("192.0.2.64") }} {{ MGMT_BASTION_MASK | default("255.255.255.224") }} management
ssh timeout 15
ssh key-exchange group dh-group14-sha256
ssh cipher encryption aes256-ctr aes192-ctr aes128-ctr
console timeout 15

! Disable legacy unencrypted protocols globally
no telnet 0.0.0.0 0.0.0.0 inside
no telnet 0.0.0.0 0.0.0.0 outside
no http server enable

! --- Security Event Auditing & SIEM Syslog Forwarding ---
logging enable
logging timestamp
logging buffer-size 131072
logging buffered warnings
logging trap informational
logging host management {{ SYSLOG_SIEM_IP | default("192.0.2.50") }}
logging facility 20
logging device-id hostname

! --- NTP Time Synchronization ---
ntp server {{ NTP_SERVER_1 | default("192.0.2.10") }} source management
ntp server {{ NTP_SERVER_2 | default("192.0.2.11") }} source management

! --- Network Object Definitions (Least Privilege) ---
object network obj-host-siem
 host {{ SYSLOG_SIEM_IP | default("192.0.2.50") }}
 description Central Security SIEM Collector
!
object network obj-host-ise
 host {{ ISE_PRIMARY_IP | default("192.0.2.60") }}
 description Cisco ISE Identity & Access Node
!
object network obj-srv-web-dmz
 host {{ DMZ_WEB_IP | default("198.51.100.10") }}
 description DMZ Public HTTPS Application Server
!
object network obj-net-mgmt-bastion
 subnet {{ MGMT_BASTION_SUBNET | default("192.0.2.64") }} {{ MGMT_BASTION_MASK | default("255.255.255.224") }}
 description Secure Engineering Bastion Hosts

! --- Access Control Lists (Explicit Permits with Deny-All Logging) ---
access-list OUTSIDE_IN extended permit tcp any object obj-srv-web-dmz eq 443
access-list OUTSIDE_IN extended deny ip any any log interval 300
!
access-list DMZ_IN extended permit tcp object obj-srv-web-dmz host {{ DB_INTERNAL_IP | default("192.0.2.70") }} eq 3306
access-list DMZ_IN extended deny ip any any log interval 300
!
access-group OUTSIDE_IN in interface outside
access-group DMZ_IN in interface dmz

! --- Modular Policy Framework (MPF) Stateful Inspection ---
class-map inspection_default
 match default-inspection-traffic
!
policy-map global_policy
 class inspection_default
  inspect icmp
  inspect icmp error
  inspect ip-options
  inspect tcp
  inspect udp
  inspect dns
!
service-policy global_policy global

! --- Site-to-Site IKEv2 / IPsec VPN Configuration ---
crypto ikev2 policy 10
 encryption aes-256
 integrity sha256
 group 14
 prf sha256
 lifetime seconds 86400
!
crypto ikev2 enable outside
!
crypto ipsec ikev2 ipsec-proposal PROPOSAL_AES256_GCM
 protocol esp encryption aes-gcm-256
 protocol esp integrity null
!
tunnel-group {{ VPN_PEER_IP | default("203.0.113.10") }} type ipsec-l2l
tunnel-group {{ VPN_PEER_IP | default("203.0.113.10") }} ipsec-attributes
 ikev2 remote-authentication pre-shared-key {{ VPN_PSK }}
 ikev2 local-authentication pre-shared-key {{ VPN_PSK }}
!
access-list VPN_CRYPTO_MAP extended permit ip 192.0.2.0 255.255.255.0 198.51.100.0 255.255.255.0
!
crypto map OUTSIDE_MAP 10 match address VPN_CRYPTO_MAP
crypto map OUTSIDE_MAP 10 set peer {{ VPN_PEER_IP | default("203.0.113.10") }}
crypto map OUTSIDE_MAP 10 set ikev2 ipsec-proposal PROPOSAL_AES256_GCM
crypto map OUTSIDE_MAP interface outside

! --- Verification Commands ---
! show version
! show interface ip brief
! show access-list
! show crypto ikev2 sa
! show crypto ipsec sa
! show logging
! write memory

